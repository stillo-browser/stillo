[workspace]
members = ["crates/core", "crates/fetcher", "crates/renderer", "crates/llm", "crates/mcp", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["stillo contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/stillo-browser/stillo"
readme = "README.md"

[workspace.dependencies]
url = "2"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["std"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
