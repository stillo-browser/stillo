[package]
name = "stillo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "AI-native terminal browser"

[[bin]]
name = "stillo"
path = "src/main.rs"

[dependencies]
stillo-core = { path = "../core", version = "0.2" }
stillo-fetcher = { path = "../fetcher", version = "0.2" }
stillo-renderer = { path = "../renderer", version = "0.2" }
stillo-llm = { path = "../llm", version = "0.2" }
stillo-mcp = { path = "../mcp", version = "0.2" }
url = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
