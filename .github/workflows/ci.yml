name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace

      # 回帰検出のため warning が出たら失敗させる
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      # cdp feature は既定で無効のため、明示的にビルドしないとコンパイルエラーが検出されない
      - name: Clippy with cdp feature
        run: cargo clippy -p stillo-fetcher --features cdp --tests -- -D warnings

      # ubuntu-latest ランナーには google-chrome が同梱されているため CDP 統合テストも実行できる
      - name: Test with cdp feature
        run: cargo test -p stillo-fetcher --features cdp
